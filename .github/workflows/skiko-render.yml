name: skiko-render

on:
  workflow_dispatch:
  push:
    branches: [sh/skiko-0.9.24-snapshots]
    paths: [.github/workflows/skiko-render.yml]

permissions:
  contents: read

jobs:
  bubble-layout:
    name: BubbleLayoutTest with Skiko 0.9.24, ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 17

      - name: Run BubbleLayoutTest
        working-directory: apps/multiplatform
        run: ./gradlew --no-daemon --console=plain -Psimplex.assets.dir=../../assets -Pkotlin.daemon.jvmargs=-Xmx4g :common:desktopTest --tests chat.simplex.app.BubbleLayoutTest

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: bubble-layout-${{ matrix.os }}
          path: apps/multiplatform/common/build/test-results/desktopTest
          retention-days: 7
          if-no-files-found: warn
